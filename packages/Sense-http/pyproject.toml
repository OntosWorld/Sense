[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-http"
version = "0.2.0"
description = "HTTP telemetry adapter for the Sense machine context SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["sense-ai>=0.2.0", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/OntosWorld/Sense"
Documentation = "https://github.com/OntosWorld/Sense/tree/main/packages/Sense-http"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_http"]
