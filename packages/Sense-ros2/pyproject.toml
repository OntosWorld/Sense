[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-ros2"
version = "0.2.0"
description = "ROS 2 adapter for Sense AI evaluation framework."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["sense-ai>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/sense_ros2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
