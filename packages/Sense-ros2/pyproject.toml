[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-ros2"
version = "0.2.0"
description = "ROS 2 adapter for the Sense machine context SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["sense-ai>=0.2.0", "PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/OntosWorld/Sense"
Documentation = "https://github.com/OntosWorld/Sense/tree/main/packages/Sense-ros2"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sense_ros2"]
