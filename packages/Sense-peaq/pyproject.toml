[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-peaq"
version = "1.0.0"
description = "peaqOS adapter for Sense AI evaluation framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["sense-ai>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/sense_peaq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
