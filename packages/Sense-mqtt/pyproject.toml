[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-mqtt"
version = "0.3.0"
description = "MQTT telemetry adapter for the Sense machine context SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["sense-ai>=0.3.0", "paho-mqtt>=2.1"]

[project.urls]
Repository = "https://github.com/OntosWorld/Sense"
Documentation = "https://github.com/OntosWorld/Sense/tree/main/packages/Sense-mqtt"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_mqtt"]
