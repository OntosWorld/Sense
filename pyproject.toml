[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-ai"
version = "0.2.0"
description = "Local-first physical machine context and capability evaluation SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "OntosWorld" },
]
keywords = ["robotics", "machines", "context", "capability", "physical-ai", "peaq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hatch",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]
peaq = ["sense-peaq>=0.2.0"]
ros2 = ["sense-ros2>=0.2.0"]

[project.urls]
Homepage = "https://github.com/OntosWorld/Sense"
Documentation = "https://github.com/OntosWorld/Sense/tree/main/docs"
Repository = "https://github.com/OntosWorld/Sense"
Changelog = "https://github.com/OntosWorld/Sense/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
