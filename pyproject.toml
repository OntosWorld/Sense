[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sense-ai"
version = "0.2.0"
description = "Local-first physical machine context and capability evaluation SDK."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "OntosWorld" },
]
keywords = ["robotics", "machines", "context", "capabilities", "peaq", "physical-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "build>=1.2",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "pip-audit>=2.7",
]
peaq = ["sense-peaq>=0.2.0"]
ros2 = ["sense-ros2>=0.2.0"]

[project.urls]
Homepage = "https://github.com/OntosWorld/Sense"
Documentation = "https://github.com/OntosWorld/Sense#readme"
Repository = "https://github.com/OntosWorld/Sense"
Changelog = "https://github.com/OntosWorld/Sense/blob/main/CHANGELOG.md"
Issues = "https://github.com/OntosWorld/Sense/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/README.md",
    "/QUICKSTART.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
