name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest tests/unit/ -v --cov=sense_ai --cov-report=term-missing

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy -p sense_ai

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/ packages/*/src/

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src/ packages/*/src/

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/contract/ -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/integration/ -v

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core and peaq adapter
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/Sense-peaq
      - run: pytest tests/e2e/ -v

  adapter-contract:
    name: Adapter contract (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ros2
            package: packages/Sense-ros2
            tests: packages/Sense-ros2/tests/test_mapping.py
          - name: mqtt
            package: packages/Sense-mqtt
            tests: packages/Sense-mqtt/tests
          - name: http
            package: packages/Sense-http
            tests: packages/Sense-http/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core and adapter
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "${{ matrix.package }}"
      - run: pytest "${{ matrix.tests }}" -v

  adapter-build:
    name: Adapter build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: peaq
            package: packages/Sense-peaq
            import_name: sense_peaq
          - name: ros2
            package: packages/Sense-ros2
            import_name: sense_ros2
          - name: mqtt
            package: packages/Sense-mqtt
            import_name: sense_mqtt
          - name: http
            package: packages/Sense-http
            import_name: sense_http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --outdir /tmp/adapter-dist "${{ matrix.package }}"
      - name: Smoke-test adapter wheel
        run: |
          python -m pip install -e .
          python -m pip install /tmp/adapter-dist/*.whl
          python -c "import ${{ matrix.import_name }}; print(${{ matrix.import_name }}.__version__)"

  ros2-runtime:
    name: ROS 2 Jazzy runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run real ROS 2 DDS bridge test
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ros:jazzy-ros-base \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                python3-pip \
                python3-venv \
                ros-jazzy-std-msgs
              source /opt/ros/jazzy/setup.bash
              python3 -m venv --system-site-packages /tmp/sense-ros
              /tmp/sense-ros/bin/python -m pip install --upgrade pip
              /tmp/sense-ros/bin/pip install -e ".[dev]"
              /tmp/sense-ros/bin/pip install -e packages/Sense-ros2
              /tmp/sense-ros/bin/pytest \
                packages/Sense-ros2/tests/test_runtime_ros2.py -v
            '

  schema-validation:
    name: JSON schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "jsonschema>=4.23"
      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          import pathlib
          import jsonschema

          for schema_file in pathlib.Path("schemas").glob("*.schema.json"):
              schema = json.loads(schema_file.read_text())
              jsonschema.Draft202012Validator.check_schema(schema)
              print(f"OK {schema_file}")
          PY

  build:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/sense-wheel
          /tmp/sense-wheel/bin/pip install dist/*.whl
          /tmp/sense-wheel/bin/python -c "from sense_ai import ContextMachine; print(ContextMachine())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and auditor
        run: |
          python -m pip install -e .
          python -m pip install pip-audit
      - name: Audit installed environment
        run: pip-audit --local --skip-editable
