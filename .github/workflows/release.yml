name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package versions
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          files = [
              pathlib.Path('pyproject.toml'),
              pathlib.Path('packages/Sense-peaq/pyproject.toml'),
              pathlib.Path('packages/Sense-ros2/pyproject.toml'),
              pathlib.Path('packages/Sense-mqtt/pyproject.toml'),
              pathlib.Path('packages/Sense-http/pyproject.toml'),
          ]
          versions = {
              path.as_posix(): tomllib.loads(path.read_text())['project']['version']
              for path in files
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'package versions are not aligned: {versions}')
          print(versions)
          PY

  build:
    name: Build ${{ matrix.name }}
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sense-ai
            path: .
          - name: sense-peaq
            path: packages/Sense-peaq
          - name: sense-ros2
            path: packages/Sense-ros2
          - name: sense-mqtt
            path: packages/Sense-mqtt
          - name: sense-http
            path: packages/Sense-http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --outdir "dist/${{ matrix.name }}" "${{ matrix.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/${{ matrix.name }}/

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sense-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
